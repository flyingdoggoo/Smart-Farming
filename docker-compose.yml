version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nckh_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartfarming
      POSTGRES_USER: nckh_user
      POSTGRES_PASSWORD: nckh_secret_2024
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
